name: build-mobile-full

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - 'mobile/**'
      - 'android/**'
      - 'ios/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-mobile-full.yml'

jobs:
  android-apk:
    name: Android installable APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Sync the complete web system into Android
        run: npx cap sync android
      - name: Build installable APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shumoos-full-system-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios-project:
    name: iPhone archive readiness
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Sync the complete web system into iPhone
        run: npx cap sync ios
      - name: Validate iPhone release build
        run: >-
          xcodebuild
          -workspace ios/App/App.xcworkspace
          -scheme App
          -configuration Release
          -sdk iphoneos
          -archivePath "$RUNNER_TEMP/Shumoos.xcarchive"
          CODE_SIGNING_ALLOWED=NO
          archive
      - name: Package validated iPhone project
        run: ditto -c -k --sequesterRsrc --keepParent ios "$RUNNER_TEMP/shumoos-ios-project.zip"
      - name: Upload validated iPhone project
        uses: actions/upload-artifact@v4
        with:
          name: shumoos-ios-project
          path: ${{ runner.temp }}/shumoos-ios-project.zip
          if-no-files-found: error
