name: build-apk

on:
  push:
    branches: [master, main, codex/render-pdf-letterhead]
    paths:
      - 'app_flutter/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app_flutter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Android scaffold
        run: flutter create . --platforms=android --project-name shumoos_elevators --org com.shumoos

      - name: Add INTERNET permission to release manifest
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <application|' android/app/src/main/AndroidManifest.xml

      - name: Bump compileSdk/targetSdk/minSdk
        run: |
          GRADLE=android/app/build.gradle.kts
          if [ ! -f "$GRADLE" ]; then GRADLE=android/app/build.gradle; fi
          echo "Patching $GRADLE"
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' "$GRADLE"
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' "$GRADLE"
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' "$GRADLE"

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shumoos-apk
          path: app_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
