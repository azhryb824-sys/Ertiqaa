# Excel recovery data refresh: 2026-08-15
services:
  - type: web
    name: ertiqaa
    runtime: node
    repo: https://github.com/azhryb824-sys/Ertiqaa
    buildCommand: npm install && node apply-contract-form-update.cjs
    startCommand: node safe-start.cjs
    # Durable storage is provided by Supabase so the Render free plan needs no disk.
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: SUPABASE_URL
        value: https://unpcsxkushhyelmoaxoa.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: AI_BACKUP_RETENTION_DAYS
        value: "365"
      - key: AI_BACKUP_INTERVAL_MINUTES
        value: "60"
      - key: SECRET_ENTRY_TOKEN
        generateValue: true
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ALLOW_PAID_VOICE
        value: "1"
      - key: VOICE_CLONE_TIMEOUT_MS
        value: "60000"
      - key: JAMEEL_VOICE_ENDPOINT
        value: https://sd-ai.onrender.com
      - key: JAMEEL_VOICE_TIMEOUT_MS
        value: "120000"
      - key: AI_INTERNET_ENABLED
        value: "0"
      - key: AI_INTERNET_REFRESH_HOURS
        value: "24"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: AI_MODEL_TIMEOUT_MS
        value: "15000"
