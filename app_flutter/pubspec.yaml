name: shumoos_elevators
description: تطبيق شموس لإدارة شركات ومؤسسات صيانة وتركيب المصاعد الإلكترونية
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  http: ^1.1.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  file_picker: ^11.0.3
  url_launcher: ^6.2.1
  image_picker: ^1.0.5
  pdf: ^3.10.7
  printing: ^5.11.1
  geolocator: ^10.1.0
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/shumoos-logo.png
